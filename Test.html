    <!-- Alpine.js Global Stores (Deferred Event Handling) -->
    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.store('favs', {
                items: JSON.parse(localStorage.getItem('bxtv_favorites') || '[]'),
                isFav(slug) { return this.items.some(item => item.slug === slug); },
                toggle(channel) {
                    if (!channel || !channel.slug) return;
                    const idx = this.items.findIndex(item => item.slug === channel.slug);
                    if (idx > -1) {
                        this.items.splice(idx, 1);
                    } else {
                        this.items.unshift({
                            slug: channel.slug,
                            name: channel.name,
                            logo: channel.logo || '',
                            country: channel.country || '',
                            category: channel.category || ''
                        });
                    }
                    localStorage.setItem('bxtv_favorites', JSON.stringify(this.items));
                },
                clearAll() {
                    this.items = [];
                    localStorage.removeItem('bxtv_favorites');
                }
            });

            Alpine.store('history', {
                items: JSON.parse(localStorage.getItem('bxtv_watch_history') || '[]'),
                add(channel) {
                    if (!channel || !channel.slug) return;
                    this.items = this.items.filter(item => item.slug !== channel.slug);
                    this.items.unshift({
                        slug: channel.slug,
                        name: channel.name,
                        logo: channel.logo || '',
                        country: channel.country || '',
                        category: channel.category || ''
                    });
                    if (this.items.length > 10) {
                        this.items = this.items.slice(0, 10);
                    }
                    localStorage.setItem('bxtv_watch_history', JSON.stringify(this.items));
                },
                remove(slug) {
                    this.items = this.items.filter(item => item.slug !== slug);
                    localStorage.setItem('bxtv_watch_history', JSON.stringify(this.items));
                },
                clearAll() {
                    this.items = [];
                    localStorage.removeItem('bxtv_watch_history');
                }
            });
        });
    </script>

    <script>
    function formatLocalTime(dateStr) {
        if (!dateStr) return '';
        try {
            const date = new Date(dateStr.replace(' ', 'T'));
            if (isNaN(date.getTime())) {
                return dateStr;
            }
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: true });
        } catch (e) {
            return dateStr;
        }
    }
    </script>

    <script>

                isReporting: false,
                reported: false,
                reportMessage: '',
                isPlaying: true,
                isMuted: false,
                volume: 1,
                levels: [],
                currentLevel: -1,
                audioTracks: [],
                currentAudioTrack: -1,
                showSettings: false,
                showAudioMenu: false,
                isFloating: false,
                controlsVisible: true,
                controlsTimeout: null,
                touchStartX: 0,
                touchEndX: 0,
                init() {
                    if (this.$store && this.$store.history) {
                        this.$store.history.add(this.channelData);
                    }
                },
                hideControlsTimer() {
                    clearTimeout(this.controlsTimeout);
                    this.controlsVisible = true;
                    this.controlsTimeout = setTimeout(() => {
                        if (this.isPlaying && !this.showSettings && !this.showAudioMenu) {
                            this.controlsVisible = false;
                        }
                    }, 4000);
                },
                togglePlay() {
                    const v = document.getElementById('videoPlayer');
                    if (!v) return;
                    if (v.paused) { v.play(); this.isPlaying = true; } 
                    else { v.pause(); this.isPlaying = false; }
                },
                toggleMute() {
                    const v = document.getElementById('videoPlayer');
                    if (!v) return;
                    v.muted = !v.muted;
                    this.isMuted = v.muted;
                },
                setVolume(val) {
                    const v = document.getElementById('videoPlayer');
                    if (!v) return;
                    this.volume = parseFloat(val);
                    v.volume = this.volume;
                    v.muted = (this.volume === 0);
                    this.isMuted = v.muted;
                },
                toggleFullscreen() {
                    const container = document.getElementById('videoPlayerViewport');
                    if (!container) return;
                    if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                        if (container.requestFullscreen) {
                            container.requestFullscreen().catch(() => {});
                        } else if (container.webkitRequestFullscreen) {
                            container.webkitRequestFullscreen();
                        } else {
                            const v = document.getElementById('videoPlayer');
                            if (v && v.webkitEnterFullscreen) v.webkitEnterFullscreen();
                        }
                    } else {
                        if (document.exitFullscreen) {
                            document.exitFullscreen().catch(() => {});
                        } else if (document.webkitExitFullscreen) {
                            document.webkitExitFullscreen();
                        }
                    }
                },
                togglePiP() {
                    const v = document.getElementById('videoPlayer');
                    if (!v) return;
                    if (document.pictureInPictureElement) {
                        document.exitPictureInPicture?.();
                    } else if (document.pictureInPictureEnabled) {
                        v.requestPictureInPicture?.();
                    }
                },
                handleTouchStart(e) {
                    this.touchStartX = e.changedTouches[0].screenX;
                },
                handleTouchEnd(e) {
                    this.touchEndX = e.changedTouches[0].screenX;
                    const diff = this.touchEndX - this.touchStartX;
                    if (Math.abs(diff) > 85 && this.relatedSlugs.length > 0) {
                        if (diff < 0) {
                            window.location.href = 'watch/' + encodeURIComponent(this.relatedSlugs[0]);
                        } else {
                            window.location.href = 'watch/' + encodeURIComponent(this.relatedSlugs[this.relatedSlugs.length - 1]);
                        }
                    }
                },
                submitReport() {
                    if (this.isReporting || this.reported) return;
                    this.isReporting = true;
                    fetch('api-report.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ channel_id: this.channelData.id })
                    })
                    .then(res => res.json())
                    .then(data => {
                        this.reported = true;
                        this.reportMessage = data.message || 'Report submitted!';
                        setTimeout(() => { this.reportMessage = ''; }, 4500);
                    })
                    .catch(() => {
                        this.reportMessage = 'Unable to send report.';
                        setTimeout(() => { this.reportMessage = ''; }, 4000);
                    })
                    .finally(() => { this.isReporting = false; });
                }
            }));
        });
    </script>

                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                                        <span class="text-[10px] hidden sm:inline" x-text="currentLevel === -1 ? 'Auto' : (levels[currentLevel]?.height ? levels[currentLevel].height + 'p' : 'HD')"></span>
                                    </button>
                                    <div x-show="showSettings" @click.outside="showSettings = false" class="absolute right-0 top-full mt-2 w-40 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl p-1.5 shadow-2xl text-xs space-y-0.5 z-40">
                                        <button @click="setQualityLevel(-1); showSettings = false" class="w-full text-left px-3 py-2 rounded-lg font-medium transition flex items-center justify-between min-h-[38px]" :class="currentLevel === -1 ? 'bg-brand-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'">
                                            <span>Auto (Adaptive)</span>
                                            <span x-show="currentLevel === -1">✓</span>
                                        </button>
                                        <template x-for="(lvl, idx) in levels" :key="idx">
                                            <button @click="setQualityLevel(idx); showSettings = false" class="w-full text-left px-3 py-2 rounded-lg font-medium transition flex items-center justify-between min-h-[38px]" :class="currentLevel === idx ? 'bg-brand-600 text-white font-bold' : 'text-slate-300 hover:bg-slate-800'">
                                                <span x-text="lvl.height ? lvl.height + 'p HD' : ('Bitrate ' + Math.round(lvl.bitrate/1000) + 'k')"></span>
                                                <span x-show="currentLevel === idx">✓</span>
                                            </button>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Center Play Button -->
                        <div class="flex items-center justify-center pointer-events-none">
                            <button @click.stop="togglePlay()" class="pointer-events-auto w-14 h-14 sm:w-16 sm:h-16 rounded-full bg-brand-600/90 hover:bg-brand-500 text-white flex items-center justify-center backdrop-blur-md shadow-2xl transition transform hover:scale-110 active:scale-95" x-show="!isPlaying">
                                <svg class="w-7 h-7 fill-current ml-1" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>

                        <!-- Bottom Control Toolbar -->
                        <div class="flex items-center justify-between gap-3 pointer-events-auto bg-black/60 backdrop-blur-md p-2.5 rounded-2xl border border-white/10">
                            <div class="flex items-center gap-3.5">
                                <button @click.stop="togglePlay()" class="text-white hover:text-brand-400 transition p-1.5 rounded-lg" title="Play/Pause">
                                    <svg x-show="isPlaying" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                                    <svg x-show="!isPlaying" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                                </button>

                                <div class="flex items-center gap-2 group/vol">
                                    <button @click.stop="toggleMute()" class="text-white hover:text-brand-400 transition p-1.5 rounded-lg" title="Mute/Unmute">
                                        <svg x-show="!isMuted && volume > 0" class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                                        <svg x-show="isMuted || volume == 0" class="w-5 h-5 fill-current text-rose-400" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
                                    </button>
                                    <input type="range" min="0" max="1" step="0.05" :value="isMuted ? 0 : volume" @input="setVolume($event.target.value)" class="w-16 sm:w-24 h-1.5 bg-white/30 rounded-lg accent-brand-500 cursor-pointer">
                                </div>
                            </div>

                            <div class="flex items-center gap-2">
                                <button onclick="triggerNativeCast()" class="text-white hover:text-brand-400 transition p-1.5 rounded-lg" title="Cast Screen">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h7m-9 14h.01M7 17a4 4 0 00-4-4m8 4a8 8 0 00-8-8"/></svg>
                                </button>

                                <button @click.stop="togglePiP()" class="text-white hover:text-brand-400 transition p-1.5 rounded-lg" title="Picture in Picture">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H4a2 2 0 01-2-2V6a2 2 0 012-2h16a2 2 0 012 2v4M14 12h6a2 2 0 012 2v6a2 2 0 01-2 2h-6a2 2 0 01-2-2v-6a2 2 0 012-2z"/></svg>
                                </button>

                                <button @click.stop="toggleFullscreen()" class="text-white hover:text-brand-400 transition p-1.5 rounded-lg" title="Fullscreen">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- AdSense Responsive Placement (Below Player) -->
                <div class="w-full overflow-hidden text-center my-2">
                    <ins class="adsbygoogle"
                         style="display:block"
                         data-ad-client="ca-pub-3940256099942544"
                         data-ad-slot="6004445831"
                         data-ad-format="auto"
                         data-full-width-responsive="true"></ins>
                    <script>
                         (adsbygoogle = window.adsbygoogle || []).push({});
                    </script>
                </div>

                <!-- Core Engine Scripts -->
                <script>
                const originalStream = "http://202.70.146.135:8000/play/a06c/index.m3u8";

                const isEmbed = false;
                let hlsInstance = null;
                let noiseInterval = null;

                function getAlpineScope() {
                    const el = document.getElementById('bxtvWatchScope');
                    return (window.Alpine && el) ? Alpine.$data(el) : null;
                }

                function triggerNativeCast() {
                    const video = document.getElementById('videoPlayer');
                    if (video && video.webkitShowPlaybackTargetPicker) {
                        video.webkitShowPlaybackTargetPicker();
                    } else if (window.chrome && window.chrome.cast) {
                        cast.framework.CastContext.getInstance().requestSession();
                    } else {
                        alert('Casting is supported via Google Cast on Chrome or AirPlay on Safari.');
                    }
                }

                function startNoiseAnimation() {
                    const canvas = document.getElementById('noiseCanvas');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    canvas.width = 240;
                    canvas.height = 160;
                    clearInterval(noiseInterval);
                    noiseInterval = setInterval(() => {
                        const idata = ctx.createImageData(canvas.width, canvas.height);
                        const buffer32 = new Uint32Array(idata.data.buffer);
                        const len = buffer32.length;
                        for (let i = 0; i < len; i++) {
                            if (Math.random() < 0.5) buffer32[i] = 0xffffffff;
                        }
                        ctx.putImageData(idata, 0, 0);
                    }, 45);
                }

                function stopNoiseAnimation() {
                    clearInterval(noiseInterval);
                }

                function setQualityLevel(lvlIdx) {
                    if (hlsInstance) {
                        hlsInstance.currentLevel = lvlIdx;
                        const scope = getAlpineScope();
                        if (scope) scope.currentLevel = lvlIdx;
                    }
                }

                function setAudioTrack(trackIdx) {
                    if (hlsInstance) {
                        hlsInstance.audioTrack = trackIdx;
                        const scope = getAlpineScope();
                        if (scope) scope.currentAudioTrack = trackIdx;
                    }
                }

                function initPlayer() {
                    if (isEmbed) return;
                    const video = document.getElementById('videoPlayer');
                    const errorBox = document.getElementById('playerError');
                    if (!video || !errorBox) return;

                    errorBox.classList.add('hidden');
                    stopNoiseAnimation();

                    if (hlsInstance) {
                        hlsInstance.destroy();
                        hlsInstance = null;
                    }

                    if (Hls.isSupported() && originalStream.includes('.m3u8')) {
                        hlsInstance = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            backBufferLength: 60
                        });

                        hlsInstance.loadSource(originalStream);
                        hlsInstance.attachMedia(video);

                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                            const scope = getAlpineScope();
                            if (scope) {
                                scope.levels = hlsInstance.levels || [];
                                scope.currentLevel = hlsInstance.currentLevel;
                                scope.audioTracks = hlsInstance.audioTracks || [];
                                scope.currentAudioTrack = hlsInstance.audioTrack;
                            }
                            video.play().catch(() => {});
                        });

                        hlsInstance.on(Hls.Events.AUDIO_TRACKS_UPDATED, function () {
                            const scope = getAlpineScope();
                            if (scope) {
                                scope.audioTracks = hlsInstance.audioTracks || [];
                                scope.currentAudioTrack = hlsInstance.audioTrack;
                            }
                        });

                        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                            if (data.fatal) {
                                console.error("Fatal Stream error:", data);
                                errorBox.classList.remove('hidden');
                                startNoiseAnimation();
                            }
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl') || originalStream.endsWith('.mp4')) {
                        video.src = originalStream;
                        video.play().catch(() => {});
                        video.onerror = () => {
                            errorBox.classList.remove('hidden');
                            startNoiseAnimation();
                        };
                    } else {
                        video.src = originalStream;
                    }
                }

                // Global Keyboard & Remote Listeners
                window.addEventListener('keydown', (e) => {
                    if (['input', 'textarea', 'select'].includes(document.activeElement.tagName.toLowerCase())) return;
                    const scope = getAlpineScope();
                    if (!scope) return;

                    switch(e.key) {
                        case ' ':
                        case 'k':
                            scope.togglePlay(); e.preventDefault(); break;
                        case 'f':
                            scope.toggleFullscreen(); e.preventDefault(); break;
                        case 'm':
                            scope.toggleMute(); e.preventDefault(); break;
                        case 'p':
                            scope.togglePiP(); e.preventDefault(); break;
                        case 'ArrowUp':
                            scope.setVolume(Math.min(1, scope.volume + 0.1)); e.preventDefault(); break;
                        case 'ArrowDown':
                            scope.setVolume(Math.max(0, scope.volume - 0.1)); e.preventDefault(); break;
                        case 'ArrowRight':
                            if (scope.relatedSlugs.length > 0) window.location.href = 'watch/' + encodeURIComponent(scope.relatedSlugs[0]);
                            break;
                        case 'ArrowLeft':
                            if (scope.relatedSlugs.length > 0) window.location.href = 'watch/' + encodeURIComponent(scope.relatedSlugs[scope.relatedSlugs.length - 1]);
                            break;
                    }
                });

                // Automatic Landscape Mobile Fullscreen Engine
                document.addEventListener('DOMContentLoaded', () => {
                    initPlayer();

                    // Scroll-down Floating Mini-Player Observer
                    const sentinel = document.getElementById('playerSentinel');
                    if (sentinel && 'IntersectionObserver' in window) {
                        const observer = new IntersectionObserver((entries) => {
                            const scope = getAlpineScope();
                            if (!scope) return;
                            scope.isFloating = !entries[0].isIntersecting;
                        }, { threshold: 0.1 });
                        observer.observe(sentinel);
                    }

                    const container = document.getElementById('videoPlayerViewport');
                    const video = document.getElementById('videoPlayer');

                    function enterMobileFullscreen() {
                        if (!container) return;
                        if (container.requestFullscreen) {
                            container.requestFullscreen().catch(() => {});
                        } else if (container.webkitRequestFullscreen) {
                            container.webkitRequestFullscreen();
                        } else if (video && video.webkitEnterFullscreen) {
                            video.webkitEnterFullscreen();
                        }
                    }

                    function exitMobileFullscreen() {
                        if (document.fullscreenElement || document.webkitFullscreenElement) {
                            if (document.exitFullscreen) {
                                document.exitFullscreen().catch(() => {});
                            } else if (document.webkitExitFullscreen) {
                                document.webkitExitFullscreen();
                            }
                        }
                    }

                    function checkOrientation() {
                        if (window.innerWidth > 1024 && !('ontouchstart' in window)) return;

                        const isLandscape = window.matchMedia("(orientation: landscape)").matches 
                                            || (window.orientation === 90 || window.orientation === -90);

                        if (isLandscape) {
                            const isPlaying = video ? !video.paused : true;
                            if (isPlaying) {
                                enterMobileFullscreen();
                            }
                        } else {
                            exitMobileFullscreen();
                        }
                    }

                    if (screen.orientation) {
                        screen.orientation.addEventListener('change', checkOrientation);
                    }
                    window.addEventListener('orientationchange', () => {
                        setTimeout(checkOrientation, 200);
                    });
                    const mql = window.matchMedia('(orientation: landscape)');
                    if (mql.addEventListener) {
                        mql.addEventListener('change', checkOrientation);
                    }
                });
                </script>

            </main>

        </body>
